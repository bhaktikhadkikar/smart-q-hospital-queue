<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMART Q | Patient Registration</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8f8;
            color: #172b3a;
        }

        /* NAVBAR */

        .navbar {
            height: 72px;
            background: #10283d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #3db5a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
        }

        .logo h2 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .back-home {
            color: #dce7ed;
            text-decoration: none;
            font-size: 14px;
        }

        .back-home:hover {
            color: #4fc1b4;
        }

        /* PAGE */

        .page {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            padding: 45px 20px;
        }

        .register-container {
            width: 100%;
            max-width: 850px;
            background: white;
            border-radius: 18px;
            box-shadow: 0 10px 35px rgba(16, 40, 61, 0.09);
            overflow: hidden;
        }

        /* HEADER */

        .form-header {
            background: #10283d;
            color: white;
            padding: 28px 35px;
        }

        .form-header h1 {
            font-size: 27px;
            margin-bottom: 8px;
        }

        .form-header p {
            color: #b9c9d1;
            font-size: 14px;
        }

        /* FORM */

        .form-body {
            padding: 35px;
        }

        .section-title {
            color: #18374b;
            font-size: 17px;
            margin-bottom: 20px;
            padding-bottom: 10px;
            border-bottom: 1px solid #e5ecef;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .form-group {
            display: flex;
            flex-direction: column;
        }

        .full-width {
            grid-column: 1 / -1;
        }

        label {
            color: #415661;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input,
        select,
        textarea {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7e1e5;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
            color: #263d49;
            background: #fbfcfc;
        }

        input:focus,
        select:focus,
        textarea:focus {
            border-color: #35ad9f;
            box-shadow: 0 0 0 3px rgba(53, 173, 159, 0.10);
        }

        textarea {
            resize: vertical;
            min-height: 90px;
        }

        .submit-area {
            margin-top: 28px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
        }

        .login-text {
            color: #71818a;
            font-size: 13px;
        }

        .submit-btn {
            border: none;
            background: #35ad9f;
            color: white;
            padding: 14px 28px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 6px 15px rgba(53, 173, 159, 0.20);
        }

        .submit-btn:hover {
            background: #26998d;
        }

        /* MOBILE */

        @media (max-width: 650px) {

            .navbar {
                padding: 0 5%;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .full-width {
                grid-column: auto;
            }

            .form-body {
                padding: 25px;
            }

            .form-header {
                padding: 25px;
            }

            .submit-area {
                flex-direction: column;
                align-items: stretch;
            }

            .submit-btn {
                width: 100%;
            }
        }
    </style>
</head>

<body>

    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            <div class="logo-icon">Q</div>
            <h2>SMART Q</h2>
        </div>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </nav>


    <!-- REGISTRATION -->

    <main class="page">

        <div class="register-container">

            <div class="form-header">

                <h1>Create Patient Account</h1>

                <p>
                    Register with SMART Q to select a doctor,
                    generate tokens and track your live queue.
                </p>

            </div>


            <form action="/register" method="POST">

                <div class="form-body">

                    <h3 class="section-title">
                        Patient Information
                    </h3>


                    <div class="form-grid">

                        <!-- NAME -->

                        <div class="form-group">

                            <label for="name">
                                Full Name
                            </label>

                            <input
                                type="text"
                                id="name"
                                name="name"
                                placeholder="Enter your full name"
                                required
                            >

                        </div>


                        <!-- MOBILE -->

                        <div class="form-group">

                            <label for="mobile">
                                Mobile Number
                            </label>

                            <input
                                type="tel"
                                id="mobile"
                                name="mobile"
                                placeholder="Enter mobile number"
                                required
                            >

                        </div>


                        <!-- EMAIL -->

                        <div class="form-group">

                            <label for="email">
                                Email Address
                            </label>

                            <input
                                type="email"
                                id="email"
                                name="email"
                                placeholder="Enter email address"
                                required
                            >

                        </div>


                        <!-- PASSWORD -->

                        <div class="form-group">

                            <label for="password">
                                Password
                            </label>

                            <input
                                type="password"
                                id="password"
                                name="password"
                                placeholder="Create a password"
                                required
                            >

                        </div>


                        <!-- AGE -->

                        <div class="form-group">

                            <label for="age">
                                Age
                            </label>

                            <input
                                type="number"
                                id="age"
                                name="age"
                                min="1"
                                max="120"
                                placeholder="Enter age"
                                required
                            >

                        </div>


                        <!-- GENDER -->

                        <div class="form-group">

                            <label for="gender">
                                Gender
                            </label>

                            <select
                                id="gender"
                                name="gender"
                                required
                            >

                                <option value="">
                                    Select gender
                                </option>

                                <option value="Male">
                                    Male
                                </option>

                                <option value="Female">
                                    Female
                                </option>

                                <option value="Other">
                                    Other
                                </option>

                            </select>

                        </div>


                        <!-- ADDRESS -->

                        <div class="form-group full-width">

                            <label for="address">
                                Address
                            </label>

                            <textarea
                                id="address"
                                name="address"
                                placeholder="Enter your complete address"
                                required
                            ></textarea>

                        </div>


                        <!-- EMERGENCY CONTACT -->

                        <div class="form-group full-width">

                            <label for="emergency_contact">
                                Emergency Contact
                            </label>

                            <input
                                type="tel"
                                id="emergency_contact"
                                name="emergency_contact"
                                placeholder="Enter emergency contact number"
                                required
                            >

                        </div>

                    </div>


                    <div class="submit-area">

                        <div class="login-text">
                            Your information will be used to manage your
                            SMART Q patient account.
                        </div>

                        <button
                            type="submit"
                            class="submit-btn"
                        >
                            Create Patient Account
                        </button>

                    </div>

                </div>

            </form>

        </div>

    </main>

</body>
</html>
