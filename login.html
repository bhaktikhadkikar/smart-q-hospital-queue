<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SMART Q | Patient Login</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f5f8f8;
            color: #172b3a;
        }

        .navbar {
            height: 72px;
            background: #10283d;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 7%;
            color: white;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .logo-icon {
            width: 42px;
            height: 42px;
            border-radius: 12px;
            background: #3db5a8;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 21px;
            font-weight: bold;
        }

        .logo h2 {
            font-size: 22px;
            letter-spacing: 1px;
        }

        .back-home {
            color: #dce7ed;
            text-decoration: none;
            font-size: 14px;
        }

        .page {
            min-height: calc(100vh - 72px);
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 35px 20px;
        }

        .login-card {
            width: 100%;
            max-width: 450px;
            background: white;
            border-radius: 18px;
            padding: 38px;
            box-shadow: 0 10px 35px rgba(16, 40, 61, 0.10);
        }

        .login-icon {
            width: 58px;
            height: 58px;
            border-radius: 15px;
            background: #e1f5f2;
            color: #229c91;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 25px;
            margin-bottom: 18px;
        }

        h1 {
            color: #10283d;
            margin-bottom: 8px;
        }

        .subtitle {
            color: #71818a;
            font-size: 14px;
            margin-bottom: 28px;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            color: #415661;
            font-size: 13px;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input {
            width: 100%;
            padding: 13px 14px;
            border: 1px solid #d7e1e5;
            border-radius: 8px;
            outline: none;
            font-size: 14px;
        }

        input:focus {
            border-color: #35ad9f;
            box-shadow: 0 0 0 3px rgba(53, 173, 159, 0.10);
        }

        .login-btn {
            width: 100%;
            border: none;
            background: #35ad9f;
            color: white;
            padding: 14px;
            border-radius: 9px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
        }

        .login-btn:hover {
            background: #26998d;
        }

        .register-text {
            text-align: center;
            margin-top: 22px;
            color: #71818a;
            font-size: 13px;
        }

        .register-text a {
            color: #229c91;
            text-decoration: none;
            font-weight: bold;
        }

        .error {
            background: #fff0ef;
            color: #b24f49;
            padding: 10px;
            border-radius: 7px;
            font-size: 13px;
            margin-bottom: 18px;
        }

        @media (max-width: 550px) {
            .navbar {
                padding: 0 5%;
            }

            .login-card {
                padding: 28px 22px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">

        <div class="logo">
            <div class="logo-icon">Q</div>
            <h2>SMART Q</h2>
        </div>

        <a href="/" class="back-home">
            ← Back to Home
        </a>

    </nav>


    <main class="page">

        <div class="login-card">

            <div class="login-icon">
                👤
            </div>

            <h1>Patient Login</h1>

            <p class="subtitle">
                Login to generate your token and track
                your hospital queue.
            </p>

            {% if error %}
                <div class="error">
                    {{ error }}
                </div>
            {% endif %}

            <form action="/login" method="POST">

                <div class="form-group">

                    <label for="email">
                        Email Address
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-btn"
                >
                    Login to SMART Q
                </button>

            </form>


            <div class="register-text">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>

    </main>

</body>
</html>
